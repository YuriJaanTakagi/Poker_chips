<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>チップレスポーカー</title>
<style>
:root{
  --bg:#E7E7E7; --panel:#FFFFFF; --ink:#000000; --sub:#8A8A8A;
  --line:#D4D4D4; --orange:#FF6A00; --danger:#4A4A4A;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  touch-action:manipulation;
}
#app{max-width:460px;margin:0 auto;padding:0 12px 140px;}
.num{font-variant-numeric:tabular-nums;}

/* header */
.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 2px 10px;
}
.top .ttl{font-weight:800;letter-spacing:.06em;font-size:14px;}
.top .sub{color:var(--sub);font-size:12px;margin-left:8px;}
.btn-undo{
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  border-radius:6px;padding:7px 12px;font-size:12px;font-weight:700;
}
.btn-undo:disabled{opacity:.25;}

/* pot */
.potbox{
  background:var(--panel);border-radius:10px;padding:16px 16px 14px;margin-bottom:10px;
  border:1px solid var(--line);
}
.potbox .lbl{font-size:11px;color:var(--sub);letter-spacing:.12em;font-weight:700;}
.potbox .val{font-size:42px;font-weight:800;letter-spacing:-.02em;line-height:1.1;}
.potbox .street{margin-top:6px;font-size:13px;font-weight:700;}
.potbox .street .dim{color:var(--sub);font-weight:400;}
.note{
  margin:8px 0 10px;padding:10px 12px;background:#000;color:#fff;
  border-radius:8px;font-size:13px;font-weight:700;
}

/* players */
.plist{background:var(--panel);border-radius:10px;border:1px solid var(--line);overflow:hidden;}
.prow{
  display:flex;align-items:center;gap:8px;
  padding:11px 12px;border-bottom:1px solid var(--line);
  border-left:4px solid transparent;
}
.prow:last-child{border-bottom:none;}
.prow.acting{border-left-color:var(--orange);background:#FFF3EA;}
.prow.folded{opacity:.4;}
.prow.outp{opacity:.3;}
.pname{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.badge{
  font-size:10px;font-weight:800;border-radius:4px;padding:2px 5px;flex:none;
}
.badge.d{background:#000;color:#fff;}
.badge.b{background:transparent;border:1px solid var(--sub);color:var(--sub);}
.badge.st{background:#000;color:#fff;}
.badge.stf{background:transparent;border:1px solid var(--sub);color:var(--sub);}
.pstack{font-weight:800;font-size:15px;text-align:right;}
.pbet{font-size:12px;color:var(--orange);font-weight:700;text-align:right;min-width:56px;}

/* action bar */
.actionbar{
  position:fixed;left:0;right:0;bottom:0;background:#000;color:#fff;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));
}
.actionbar .inner{max-width:460px;margin:0 auto;}
.actionbar .who{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.actionbar .who .nm{font-weight:800;font-size:17px;}
.actionbar .who .tc{font-size:13px;color:#BBB;}
.abtns{display:flex;gap:8px;}
.abtn{
  flex:1;border:none;border-radius:8px;padding:15px 4px;font-size:15px;font-weight:800;
  color:#fff;
}
.abtn.fold{background:#3A3A3A;}
.abtn.call{background:#FFF;color:#000;}
.abtn.raise{background:var(--orange);}
.abtn:disabled{opacity:.3;}

/* raise panel */
.rpanel{margin-top:12px;border-top:1px solid #333;padding-top:12px;}
.rpanel .rv{font-size:34px;font-weight:800;text-align:center;margin-bottom:6px;}
.rpanel input[type=range]{width:100%;accent-color:var(--orange);margin:2px 0 10px;}
.rrow{display:flex;gap:6px;margin-bottom:8px;}
.rp{
  flex:1;border:1px solid #555;background:transparent;color:#fff;
  border-radius:6px;padding:10px 2px;font-size:12px;font-weight:700;
}
.rstep{display:flex;gap:6px;margin-bottom:10px;}
.rstep button{
  flex:1;border:1px solid #555;background:transparent;color:#fff;
  border-radius:6px;padding:12px 2px;font-size:15px;font-weight:800;
}
.rconfirm{display:flex;gap:8px;}
.rconfirm .ok{flex:2;background:var(--orange);}
.rconfirm .ng{flex:1;background:#3A3A3A;}

/* setup / forms */
h1.logo{font-size:22px;font-weight:800;letter-spacing:.04em;margin:26px 0 2px;}
p.tag{color:var(--sub);font-size:13px;margin:0 0 18px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:12px;}
.card h2{font-size:13px;margin:0 0 10px;letter-spacing:.08em;}
.cnt{display:flex;flex-wrap:wrap;gap:6px;}
.cnt button{
  width:42px;height:42px;border-radius:8px;border:1px solid var(--line);
  background:#fff;font-size:16px;font-weight:800;color:var(--ink);
}
.cnt button.on{background:#000;color:#fff;border-color:#000;}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.frow:last-child{margin-bottom:0;}
.frow label{font-size:13px;font-weight:700;flex:none;}
.frow input{
  width:120px;padding:10px;border:1px solid var(--line);border-radius:8px;
  font-size:16px;text-align:right;font-weight:700;
}
.nrow input{width:100%;text-align:left;font-weight:700;font-size:15px;padding:10px;
  border:1px solid var(--line);border-radius:8px;margin-bottom:8px;}
.primary{
  width:100%;border:none;border-radius:10px;background:var(--orange);color:#fff;
  font-size:16px;font-weight:800;padding:16px;margin-top:4px;
}
.secondary{
  width:100%;border:1px solid var(--ink);border-radius:10px;background:transparent;color:var(--ink);
  font-size:14px;font-weight:800;padding:13px;margin-top:8px;
}
.ghost{
  width:100%;border:none;background:transparent;color:var(--sub);
  font-size:13px;font-weight:700;padding:10px;margin-top:4px;text-decoration:underline;
}

/* showdown */
.potcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;}
.potcard .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.potcard .ph .n{font-size:13px;font-weight:800;letter-spacing:.06em;}
.potcard .ph .a{font-size:20px;font-weight:800;}
.wsel{display:flex;flex-wrap:wrap;gap:6px;}
.wsel button{
  border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:20px;padding:9px 14px;font-size:14px;font-weight:700;
}
.wsel button.on{background:var(--orange);border-color:var(--orange);color:#fff;}
.retn{font-size:13px;color:var(--sub);font-weight:700;}

/* hand end */
.res{display:flex;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center;}
.res:last-child{border-bottom:none;}
.res .d{font-weight:800;}
.res .d.plus{color:var(--orange);}
.res .d.minus{color:var(--sub);}
.res input{width:100px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:15px;text-align:right;font-weight:700;}
.footer{color:var(--sub);font-size:11px;text-align:center;margin-top:26px;letter-spacing:.08em;}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString("ja-JP");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STREETS=["プリフロップ","フロップ","ターン","リバー"];

let S=null, hist=[];
let ui={raiseOpen:false,raiseVal:0,potWinners:[],editStacks:false};
let setup={count:4,names:{},stack:10000,sb:50,bb:100,ante:0};

const deep=o=>JSON.parse(JSON.stringify(o));
function push(){hist.push(deep(S)); if(hist.length>80)hist.shift();}
function undo(){
  if(!hist.length)return;
  S=hist.pop();
  ui.raiseOpen=false;
  ui.potWinners=(S.screen==="showdown"&&S.pots)?S.pots.map(()=>[]):[];
  render();
}

const alive=p=>!p.out;
const inHand=p=>!p.out&&!p.folded;
const canBet=p=>inHand(p)&&!p.allIn;
function nextIdx(i,cond){
  const n=S.players.length;
  for(let k=1;k<=n;k++){const j=(i+k)%n;if(cond(S.players[j]))return j;}
  return -1;
}
const potTotal=()=>S.players.reduce((a,p)=>a+p.contributed,0);

/* ---------- game flow ---------- */
function startGame(){
  const names=[];
  for(let i=0;i<setup.count;i++) names.push((setup.names[i]||"").trim()||("プレイヤー"+(i+1)));
  if(!(setup.bb>0)||!(setup.sb>=0)||!(setup.stack>=setup.bb)){alert("スタック・ブラインドの値を確認してください");return;}
  S={
    players:names.map((nm,i)=>({id:i,name:nm,stack:setup.stack,folded:false,allIn:false,bet:0,contributed:0,need:false,out:false,start:setup.stack})),
    sb:setup.sb,bb:setup.bb,ante:setup.ante||0,
    handNo:0,dealerIdx:Math.floor(Math.random()*names.length),
    street:0,currentBet:0,lastRaise:0,acting:-1,sbIdx:-1,bbIdx:-1,
    screen:"game",note:"",pots:null,result:null
  };
  hist=[];
  startHand(true);
}

function postForced(i,amt){
  const p=S.players[i];const a=Math.min(amt,p.stack);
  p.stack-=a;p.bet+=a;p.contributed+=a;
  if(p.stack===0)p.allIn=true;
}

function startHand(first){
  S.players.forEach(p=>{
    p.out=p.stack<=0;
    p.folded=p.out;p.allIn=false;p.bet=0;p.contributed=0;p.need=false;p.start=p.stack;
  });
  const act=S.players.filter(alive);
  if(act.length<2){S.screen="gameover";render();return;}
  S.handNo++;
  if(!first)S.dealerIdx=nextIdx(S.dealerIdx,alive);
  else if(!alive(S.players[S.dealerIdx]))S.dealerIdx=nextIdx(S.dealerIdx,alive);
  S.street=0;S.note="";S.pots=null;S.result=null;
  if(S.ante>0)S.players.filter(alive).forEach(p=>{
    const a=Math.min(S.ante,p.stack);p.stack-=a;p.contributed+=a;
    if(p.stack===0)p.allIn=true;
  });
  let sbI,bbI;
  if(act.length===2){sbI=S.dealerIdx;bbI=nextIdx(sbI,alive);}
  else{sbI=nextIdx(S.dealerIdx,alive);bbI=nextIdx(sbI,alive);}
  postForced(sbI,S.sb);postForced(bbI,S.bb);
  S.sbIdx=sbI;S.bbIdx=bbI;
  S.currentBet=S.bb;S.lastRaise=S.bb;
  S.players.forEach(p=>{p.need=canBet(p);});
  S.acting=nextIdx(bbI,p=>canBet(p)&&p.need);
  S.screen="game";
  if(S.acting===-1){endStreet();return;}
  render();
}

function actFold(){
  push();
  const p=S.players[S.acting];p.folded=true;p.need=false;
  afterAction();
}
function actCheckCall(){
  push();
  const p=S.players[S.acting];
  const toCall=Math.max(0,S.currentBet-p.bet);
  const pay=Math.min(toCall,p.stack);
  p.stack-=pay;p.bet+=pay;p.contributed+=pay;
  if(p.stack===0)p.allIn=true;
  p.need=false;
  afterAction();
}
function actRaiseTo(amt){
  push();
  const p=S.players[S.acting];
  const maxTo=p.bet+p.stack;
  amt=Math.max(0,Math.min(Math.floor(amt),maxTo));
  const pay=amt-p.bet;
  if(pay<=0){hist.pop();return;}
  p.stack-=pay;p.bet=amt;p.contributed+=pay;
  if(p.stack===0)p.allIn=true;
  if(p.bet>S.currentBet){
    const rs=p.bet-S.currentBet;
    if(rs>=S.lastRaise)S.lastRaise=rs;
    S.currentBet=p.bet;
    S.players.forEach(q=>{if(q!==p&&canBet(q))q.need=true;});
  }
  p.need=false;ui.raiseOpen=false;
  afterAction();
}

function afterAction(){
  const live=S.players.filter(inHand);
  if(live.length===1){
    const w=live[0];const total=potTotal();
    w.stack+=total;
    S.result={type:"uncontested",winner:w.id,amount:total};
    S.screen="handend";ui.editStacks=false;render();return;
  }
  const nxt=nextIdx(S.acting,p=>canBet(p)&&p.need);
  if(nxt===-1)endStreet();
  else{S.acting=nxt;ui.raiseOpen=false;render();}
}

function endStreet(){
  S.players.forEach(p=>p.bet=0);
  S.currentBet=0;S.lastRaise=S.bb;
  const bettors=S.players.filter(canBet);
  if(S.street>=3||bettors.length<=1){goShowdown(S.street<3);return;}
  S.street++;
  S.players.forEach(p=>{p.need=canBet(p);});
  S.acting=nextIdx(S.dealerIdx,canBet);
  ui.raiseOpen=false;
  render();
}

function computePots(){
  const inP=S.players.filter(p=>!p.folded&&!p.out);
  const levels=[...new Set(inP.map(p=>p.contributed))].sort((a,b)=>a-b);
  let pots=[],prev=0;
  levels.forEach(L=>{
    let amt=0;
    S.players.forEach(p=>{amt+=Math.max(0,Math.min(p.contributed,L)-prev);});
    const elig=inP.filter(p=>p.contributed>=L).map(p=>p.id);
    if(amt>0)pots.push({amount:amt,eligible:elig});
    prev=L;
  });
  let extra=0;
  S.players.forEach(p=>{extra+=Math.max(0,p.contributed-prev);});
  if(extra>0&&pots.length)pots[pots.length-1].amount+=extra;
  const merged=[];
  pots.forEach(pt=>{
    const last=merged[merged.length-1];
    if(last&&last.eligible.join()===pt.eligible.join())last.amount+=pt.amount;
    else merged.push(pt);
  });
  return merged;
}

function goShowdown(early){
  S.pots=computePots();
  S.note=early?"残りのボードを配ってからショーダウンしてください":"";
  ui.potWinners=S.pots.map(()=>[]);
  S.screen="showdown";render();
}

function toggleWinner(pi,id){
  const arr=ui.potWinners[pi];
  const k=arr.indexOf(id);
  if(k>=0)arr.splice(k,1);else arr.push(id);
  render();
}

function orderFromDealer(ids){
  const out=[];const n=S.players.length;
  for(let k=1;k<=n;k++){
    const j=(S.dealerIdx+k)%n;
    if(ids.includes(j))out.push(j);
  }
  return out;
}

function confirmShowdown(){
  for(let i=0;i<S.pots.length;i++){
    if(S.pots[i].eligible.length>1&&ui.potWinners[i].length===0){
      alert((i===0?"メインポット":"サイドポット"+i)+"の勝者を選択してください");return;
    }
  }
  push();
  const results=[];
  S.pots.forEach((pt,i)=>{
    let ws=pt.eligible.length===1?[pt.eligible[0]]:ui.potWinners[i].slice();
    ws=orderFromDealer(ws);
    const share=Math.floor(pt.amount/ws.length);
    let rem=pt.amount-share*ws.length;
    ws.forEach(id=>{
      let add=share+(rem>0?1:0);if(rem>0)rem--;
      S.players[id].stack+=add;
    });
    results.push({idx:i,amount:pt.amount,winners:ws,ret:pt.eligible.length===1});
  });
  S.result={type:"showdown",results};
  S.screen="handend";ui.editStacks=false;render();
}

function nextHand(){push();startHand(false);}
function endGame(){
  if(!confirm("ゲームを終了して最終結果を表示しますか？"))return;
  push();S.screen="gameover";render();
}
function newGame(){
  if(S&&S.screen!=="gameover"&&!confirm("進行中のゲームを破棄しますか？"))return;
  S=null;hist=[];render();
}

/* ---------- renders ---------- */
function render(){
  const app=$("#app");
  if(!S){app.innerHTML=vSetup();return;}
  if(S.screen==="game")app.innerHTML=vGame();
  else if(S.screen==="showdown")app.innerHTML=vShowdown();
  else if(S.screen==="handend")app.innerHTML=vHandEnd();
  else if(S.screen==="gameover")app.innerHTML=vGameOver();
}

function vSetup(){
  let cnt="";
  for(let i=2;i<=9;i++)cnt+=`<button class="${setup.count===i?"on":""}" onclick="setup.count=${i};render()">${i}</button>`;
  let names="";
  for(let i=0;i<setup.count;i++){
    names+=`<input class="numname" maxlength="10" placeholder="プレイヤー${i+1}" value="${esc(setup.names[i]||"")}" oninput="setup.names[${i}]=this.value">`;
  }
  return `
  <h1 class="logo">チップレスポーカー</h1>
  <p class="tag">チップなしでテキサスホールデム。サイドポットも自動計算。</p>
  <div class="card">
    <h2>人数（ディーラー除く）</h2>
    <div class="cnt">${cnt}</div>
  </div>
  <div class="card nrow">
    <h2>プレイヤー名</h2>
    ${names}
  </div>
  <div class="card">
    <h2>チップ設定</h2>
    <div class="frow"><label>持ち点</label><input type="number" inputmode="numeric" value="${setup.stack}" oninput="setup.stack=+this.value||0"></div>
    <div class="frow"><label>SB</label><input type="number" inputmode="numeric" value="${setup.sb}" oninput="setup.sb=+this.value||0"></div>
    <div class="frow"><label>BB</label><input type="number" inputmode="numeric" value="${setup.bb}" oninput="setup.bb=+this.value||0"></div>
    <div class="frow"><label>アンティ（任意）</label><input type="number" inputmode="numeric" value="${setup.ante}" oninput="setup.ante=+this.value||0"></div>
  </div>
  <button class="primary" onclick="startGame()">ゲーム開始</button>
  <div class="footer">by Amor</div>`;
}

function badgeHTML(i){
  let b="";
  if(i===S.dealerIdx)b+=`<span class="badge d">D</span>`;
  if(i===S.sbIdx)b+=`<span class="badge b">SB</span>`;
  if(i===S.bbIdx)b+=`<span class="badge b">BB</span>`;
  return b;
}

function vPlayers(){
  return `<div class="plist">`+S.players.map((p,i)=>{
    let cls="prow";
    if(p.out)cls+=" outp";else if(p.folded)cls+=" folded";
    if(S.screen==="game"&&i===S.acting)cls+=" acting";
    let st="";
    if(p.out)st=`<span class="badge stf">バスト</span>`;
    else if(p.folded)st=`<span class="badge stf">フォールド</span>`;
    else if(p.allIn)st=`<span class="badge st">ALL IN</span>`;
    const bet=p.bet>0?`<span class="pbet num">${fmt(p.bet)}</span>`:`<span class="pbet"></span>`;
    return `<div class="${cls}">
      <span class="pname">${esc(p.name)}</span>${badgeHTML(i)}${st}
      ${bet}<span class="pstack num">${fmt(p.stack)}</span>
    </div>`;
  }).join("")+`</div>`;
}

function vGame(){
  const p=S.players[S.acting];
  const toCall=Math.max(0,S.currentBet-p.bet);
  const callAllIn=toCall>=p.stack;
  const callLbl=toCall===0?"チェック":(callAllIn?`ALL IN コール`:`コール ${fmt(Math.min(toCall,p.stack))}`);
  const minTo=S.currentBet+S.lastRaise;
  const maxTo=p.bet+p.stack;
  const canRaise=maxTo>S.currentBet&&!callAllIn;
  const raiseLbl=S.currentBet===0?"ベット":"レイズ";
  let rpanel="";
  if(ui.raiseOpen&&canRaise){
    const lo=Math.min(minTo,maxTo);
    const potNow=potTotal();
    const step=Math.max(1,S.sb);
    const clamp=v=>Math.max(lo,Math.min(maxTo,Math.round(v/step)*step||lo));
    const half=clamp(S.currentBet+Math.floor((potNow+toCall)/2));
    const pot=clamp(S.currentBet+potNow+toCall);
    rpanel=`<div class="rpanel">
      <div class="rv num">${fmt(ui.raiseVal)}</div>
      <input type="range" min="${lo}" max="${maxTo}" step="${step}" value="${ui.raiseVal}"
        oninput="ui.raiseVal=+this.value;this.parentNode.querySelector('.rv').textContent=fmt(ui.raiseVal)">
      <div class="rstep">
        <button onclick="ui.raiseVal=Math.max(${lo},ui.raiseVal-${S.bb});render()">−BB</button>
        <button onclick="ui.raiseVal=Math.min(${maxTo},ui.raiseVal+${S.bb});render()">＋BB</button>
      </div>
      <div class="rrow">
        <button class="rp" onclick="ui.raiseVal=${lo};render()">最小</button>
        <button class="rp" onclick="ui.raiseVal=${half};render()">½ポット</button>
        <button class="rp" onclick="ui.raiseVal=${pot};render()">ポット</button>
        <button class="rp" onclick="ui.raiseVal=${maxTo};render()">ALL IN</button>
      </div>
      <div class="rconfirm">
        <button class="abtn ng" onclick="ui.raiseOpen=false;render()">キャンセル</button>
        <button class="abtn ok" onclick="actRaiseTo(ui.raiseVal)">${raiseLbl} 確定</button>
      </div>
    </div>`;
  }
  return `
  <div class="top">
    <div><span class="ttl">HAND ${S.handNo}</span><span class="sub">SB ${fmt(S.sb)} / BB ${fmt(S.bb)}${S.ante>0?" / A "+fmt(S.ante):""}</span></div>
    <button class="btn-undo" onclick="undo()" ${hist.length?"":"disabled"}>⟲ 戻す</button>
  </div>
  <div class="potbox">
    <div class="lbl">POT</div>
    <div class="val num">${fmt(potTotal())}</div>
    <div class="street">${STREETS[S.street]}<span class="dim">　現在のベット ${fmt(S.currentBet)}</span></div>
  </div>
  ${vPlayers()}
  <div class="actionbar"><div class="inner">
    <div class="who">
      <span class="nm">${esc(p.name)} の番</span>
      <span class="tc num">${toCall>0?"コールまで "+fmt(toCall):"チェック可"}</span>
    </div>
    <div class="abtns">
      <button class="abtn fold" onclick="actFold()">フォールド</button>
      <button class="abtn call" onclick="actCheckCall()">${callLbl}</button>
      ${canRaise?`<button class="abtn raise" onclick="ui.raiseOpen=!ui.raiseOpen;ui.raiseVal=Math.min(${minTo},${maxTo});render()">${raiseLbl}</button>`:""}
    </div>
    ${rpanel}
  </div></div>`;
}

function vShowdown(){
  const pots=S.pots.map((pt,i)=>{
    const name=i===0?"メインポット":"サイドポット "+i;
    let body="";
    if(pt.eligible.length===1){
      body=`<div class="retn">${esc(S.players[pt.eligible[0]].name)} に自動返却（コールなし分）</div>`;
    }else{
      body=`<div class="wsel">`+pt.eligible.map(id=>{
        const on=ui.potWinners[i].includes(id)?"on":"";
        return `<button class="${on}" onclick="toggleWinner(${i},${id})">${esc(S.players[id].name)}</button>`;
      }).join("")+`</div>`;
    }
    return `<div class="potcard">
      <div class="ph"><span class="n">${name}</span><span class="a num">${fmt(pt.amount)}</span></div>
      ${body}
    </div>`;
  }).join("");
  return `
  <div class="top">
    <div><span class="ttl">ショーダウン</span><span class="sub">HAND ${S.handNo}</span></div>
    <button class="btn-undo" onclick="undo()" ${hist.length?"":"disabled"}>⟲ 戻す</button>
  </div>
  ${S.note?`<div class="note">${S.note}</div>`:""}
  <div class="note" style="background:#fff;color:#000;border:1px solid var(--line)">各ポットの勝者をタップ（引き分けは複数選択）</div>
  ${pots}
  <button class="primary" onclick="confirmShowdown()">ポットを分配</button>`;
}

function vHandEnd(){
  let head="";
  if(S.result.type==="uncontested"){
    head=`<div class="note">${esc(S.players[S.result.winner].name)} が ${fmt(S.result.amount)} を獲得（全員フォールド）</div>`;
  }else{
    head=S.result.results.map(r=>{
      const nm=r.idx===0?"メインポット":"サイドポット"+r.idx;
      const ws=r.winners.map(id=>esc(S.players[id].name)).join("、");
      return `<div class="note">${nm} ${fmt(r.amount)} → ${ws}${r.ret?"（返却）":""}</div>`;
    }).join("");
  }
  const rows=S.players.map((p,i)=>{
    const d=p.stack-p.start;
    const dc=d>0?"plus":(d<0?"minus":"");
    const stackCell=ui.editStacks
      ?`<input type="number" inputmode="numeric" value="${p.stack}" onchange="S.players[${i}].stack=Math.max(0,+this.value||0);render()">`
      :`<span class="num" style="font-weight:800">${fmt(p.stack)}</span>`;
    return `<div class="res">
      <span style="flex:1;font-weight:700">${esc(p.name)}${p.stack<=0?'　<span class="badge stf">バスト</span>':""}</span>
      <span class="d ${dc} num" style="margin-right:12px">${d>0?"+":""}${fmt(d)}</span>
      ${stackCell}
    </div>`;
  }).join("");
  return `
  <div class="top">
    <div><span class="ttl">HAND ${S.handNo} 結果</span></div>
    <button class="btn-undo" onclick="undo()" ${hist.length?"":"disabled"}>⟲ 戻す</button>
  </div>
  ${head}
  <div class="plist">${rows}</div>
  <button class="secondary" onclick="ui.editStacks=!ui.editStacks;render()">${ui.editStacks?"調整を完了":"スタック調整（リバイ等）"}</button>
  <button class="primary" onclick="nextHand()">次のハンドへ</button>
  <button class="ghost" onclick="endGame()">ゲーム終了・最終結果</button>`;
}

function vGameOver(){
  const ranked=S.players.slice().sort((a,b)=>b.stack-a.stack);
  const rows=ranked.map((p,i)=>`<div class="res">
    <span style="flex:1;font-weight:700">${i+1}位　${esc(p.name)}</span>
    <span class="num" style="font-weight:800">${fmt(p.stack)}</span>
  </div>`).join("");
  return `
  <h1 class="logo">最終結果</h1>
  <p class="tag">${S.handNo} ハンド終了</p>
  <div class="plist">${rows}</div>
  <button class="primary" onclick="newGame()">新しいゲーム</button>
  <div class="footer">by Amor</div>`;
}

window.addEventListener("beforeunload",e=>{
  if(S&&S.screen!=="gameover"){e.preventDefault();e.returnValue="";}
});

render();
</script>
</body>
</html>
